<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/jtech-favicon.png" />
		<link
			rel="apple-touch-icon"
			type="image/png"
			href="%sveltekit.assets%/jtech-apple-touch.png"
		/>
		<meta name="viewport" content="width=device-width" />

		<meta name="author" content="Nato Boram" />
		<meta name="keywords" content="JTechForums, Lmjtfy" />

		<meta property="og:image" content="images/Lmgtfy.png" />
		<meta property="og:title" content="Let me search JTechForums for you" />

		<!-- Prevents the white flash on page load -->
		<script>
			const brightness = localStorage.getItem('brightness')

			if (brightness === 'light') document.documentElement.classList.remove('dark')
			else if (brightness === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches)
				document.documentElement.classList.add('dark')
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#242424]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
